{%extends './inni.html'%}
<body>
	<div class="container-fluid bg-light">
        <!-- Section with content and py loop -->
        <!-- //video-6-->
        {%block one%}
        <section class="w3l-ecommerce-main mt-3">
            <!-- /products-->
            <div class="ecom-contenthny py-5">
                <div class="container py-lg-5 py-5">
                    <h3 class="hny-title mb-0 text-center">Best Handbags </h3>
                    <p class="text-center">Handpicked Favourites just for you</p>
                    <!-- /row-->
                    <div class="ecom-products-grids row mt-lg-5 mt-3 justify-content-center">
                        {% if products %}
                        {% for x in products %}
                        
                        
                          <div class="col-lg-3 col-6 product-incfhny mt-4">
                            <div class="product-grid2 transmitv">
                                <form action="{{ url_for('add_to_cart', item_id=x.product_id) }}" method="post">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                              <div class="product-image2">
                                <a href="#">
                                  <img class="pic-1 img-fluid" src="/static/uploads/{{ x.front_img }}">
                                  <img class="pic-2 img-fluid" src="/static/uploads/{{ x.back_img }}">
                                </a>
                        
                                <ul class="social">
                                  <li>
                                    <a href="#" data-tip="Quick View"><span class="fa fa-eye"></span></a>
                                  </li>
                                </ul>
                        
                                <div class="transmitv single-item">
                                  <button type="submit" class="transmitv-cart bg-danger ptransmitv-cart add-to-cart" style="border: none; background: none;">
                                    <span class="fa fa-shopping-bag"></span> Add to Cart
                                  </button>
                                </div>
                              </div>
                              <div class="mt-2">
                                <input type="text" name="quantity" class="form-control" value="1" placeholder="Quantity">
                              </div>
                        
                              <div class="mt-2">
                                <select name="size" class="form-control" required>
                                  <option value="">Select size</option>
                                  {% for size in x.size %}
                                  <option value="{{ size }}">{{ size }}</option>
                                  {% endfor %}
                                </select>
                              </div>
                            
                        
                              <div class="product-content">
                                <h3 class="title">{{ x.product_name }}</h3>
                                <span class="price">
                                  <del>&#8358; {{ x.delprice }}0</del>
                                  &#8358; {{ x.price }}0
                                </span>
                              </div>
                        
                              <div id="feedback"></div>
                            </form>
                            </div>
                          </div>
                      
                        {% endfor %}
                        
                        {%else%}
                                <div class="text-center">
                                    <h4 class="alert alert-info">No Product Available check back shortly</h4>
                                </div>
                        {%endif%}
                                

                    </div>
                    <!-- //row-->
                </div>
            </div>
        </section>
        {%endblock%}
        <!-- //products-->
        <!-- End of the section -->









    </div>











    <script src="bootstrap/js/bootstrap.bundle.min.js" type="text/javascript"></script>     
</body>
</html>
