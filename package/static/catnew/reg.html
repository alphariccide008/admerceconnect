		body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
		
		.first-sec{
			background-image: linear-gradient(to right, rgba(27, 30, 33, 0.7),rgba(43, 47, 51, 0.7)10%), url("images/main1.jpg");
			background-size: cover;
			background-position: center;
			height:1000px;
			background-repeat: no-repeat;
			background-attachment: fixed;
			font-family: sans-serif;
			margin-bottom: 20px;
            padding-top: 200px;
			
		
        }
        .form{
            opacity: 60%;
            border: 1px solid white;
            
        }
        .custom{
            color: rgb(168, 110, 18);
        }
        .custom1{
            color: rgb(114, 15, 15);
        }
        .cust-btn{
            background-color: rgb(221, 155, 93);

        .cust-input{
            border: 1px solid rgb(145, 85, 7);
        }

<body>
	<div class="container-fluid first-sec">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="row justify-content-center">
                    
                    <div class="col-md-6">
                        <form action="#" class="card form mx-3 p-5" method="POST">
                            <h3 class="text-center">Sign Up!</h3>
                            <input type="text"  name="fname" id="email" class="form-control my-3 cust-input" placeholder="Firstname" >
                            <input type="text"  name="lname" id="lname" class="form-control my-3 cust-input" placeholder="Lastname" >
                            <input type="text"  name="email" id="email" class="form-control my-3 cust-input" placeholder="Email" >
                            <input type="text"  name="uname" id="uname" class="form-control my-3 cust-input" placeholder="Username" >
                            <input type="text"  name="phone" id="phone" class="form-control my-3 cust-input" placeholder="Phone Number" >

                            <input type="password" name="pass" id="pass" class="form-control my-3 cust-input" placeholder="Enter Password">
                            <input type="password" name="confpass" id="pass" class="form-control my-3 cust-input" placeholder="Confirm Password">

                            <div class="my-2">
                                <input type="checkbox"> 
                                <a href="#" style="text-decoration: none; color: rgb(145, 69, 69);">Read Terms and Conditons</a>
                            </div>
                            <div class="my-3">
                                <button class="cust-btn text-white form-control">Register</button>
                                
                            </div>
                            <a href="login.html" class="custom1">Already a member? Sign Up</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
